<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海边小屋 · 照片墙 🌊</title>
<style>
  :root {
    --ink: #23404e;
    --wood: #a06a3c;
    --card: #fffdf7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(180deg,
      #aee3f5 0%, #c9edf7 22%,
      #7fd0e8 34%, #3aa8cf 46%,
      #2a92c0 52%,
      #f6e3b8 58%, #f3d9a0 72%,
      #eed49a 100%);
    overflow-x: hidden;
  }

  .sun {
    position: fixed; top: 6vh; right: 10vw; width: 90px; height: 90px;
    border-radius: 50%; z-index: 0;
    background: radial-gradient(circle at 40% 35%, #fff6c9, #ffd76e 60%, #ffc23e);
    box-shadow: 0 0 60px 24px rgba(255, 220, 120, .55);
  }
  .cloud { position: fixed; z-index: 0; opacity: .9; filter: blur(1px);
    animation: drift 60s linear infinite; }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud.c1 { top: 9vh; width: 130px; height: 34px; background: #fff; border-radius: 34px; }
  .cloud.c1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
  .cloud.c1::after  { width: 44px; height: 44px; top: -20px; left: 66px; }
  .cloud.c2 { top: 17vh; left: -160px; width: 100px; height: 26px; background: #fff; border-radius: 26px;
    animation-duration: 85s; animation-delay: -30s; }
  .cloud.c2::before { width: 46px; height: 46px; top: -22px; left: 16px; }
  .cloud.c2::after  { width: 34px; height: 34px; top: -14px; left: 50px; }
  @keyframes drift { to { transform: translateX(120vw); } }

  .seagull {
    position: fixed; z-index: 0; font-size: 26px; opacity: .8;
    animation: fly 38s linear infinite;
  }
  .g1 { top: 14vh; }
  .g2 { top: 21vh; font-size: 18px; animation-delay: -14s; }
  @keyframes fly {
    from { transform: translateX(-8vw) translateY(0); }
    50%  { transform: translateX(55vw) translateY(-20px); }
    to   { transform: translateX(118vw) translateY(0); }
  }

  .waves {
    position: fixed; top: 47vh; left: 0; right: 0; height: 60px; z-index: 0;
    opacity: .5;
    background:
      radial-gradient(circle at 25% 100%, transparent 40px, rgba(255,255,255,.5) 41px, transparent 42px) 0 0/120px 40px repeat-x,
      radial-gradient(circle at 75% 100%, transparent 46px, rgba(255,255,255,.35) 47px, transparent 48px) 0 22px/160px 40px repeat-x;
    animation: waveline 9s ease-in-out infinite alternate;
  }
  @keyframes waveline { from { transform: translateX(0); } to { transform: translateX(-60px); } }

  .content { position: relative; z-index: 2; }

  header { text-align: center; padding: 64px 20px 8px; }
  header h1 {
    display: inline-block;
    font-size: clamp(30px, 5vw, 48px);
    letter-spacing: .12em; color: #14506b;
    background: rgba(255,255,255,.75);
    padding: 10px 34px; border-radius: 999px;
    box-shadow: 0 6px 20px rgba(20,80,107,.25);
  }
  header p { margin-top: 14px; color: #175b78; letter-spacing: .32em; font-size: 14px;
    text-shadow: 0 1px 0 rgba(255,255,255,.6); }

  .wall-section {
    max-width: 1150px; margin: 34px auto 0; padding: 70px 30px 90px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 130px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.06) 0 1px, transparent 1px 46px),
      linear-gradient(180deg, #b98a5d, #a5744a);
    border-radius: 18px;
    box-shadow: 0 30px 60px rgba(20, 60, 80, .35), inset 0 0 80px rgba(70, 40, 15, .28);
  }

  .wall {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 56px 44px; margin-top: 40px;
  }

  .frame {
    position: relative; width: 280px;
    background: var(--card);
    padding: 12px 12px 52px;
    box-shadow: 0 2px 4px rgba(0,0,0,.2), 0 16px 32px rgba(60, 35, 10, .35);
    border-radius: 4px;
    cursor: pointer;
    transition: transform .35s ease, box-shadow .35s ease;
    transform: rotate(var(--tilt, 0deg));
    animation: sway 6s ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s);
    transform-origin: top center;
  }
  .frame:nth-child(3n)   { --tilt: 1.6deg; }
  .frame:nth-child(3n+1) { --tilt: -1.7deg; }
  .frame:nth-child(4n)   { --tilt: .9deg; }
  .frame:nth-child(2n)   { --delay: -2s; }
  .frame:nth-child(5n)   { --delay: -4s; }
  @keyframes sway {
    from { transform: rotate(calc(var(--tilt, 0deg) - .7deg)); }
    to   { transform: rotate(calc(var(--tilt, 0deg) + .7deg)); }
  }
  .frame:hover {
    animation-play-state: paused;
    transform: rotate(0) scale(1.05) translateY(-6px);
    box-shadow: 0 4px 8px rgba(0,0,0,.22), 0 26px 50px rgba(60,35,10,.45);
    z-index: 6;
  }

  .frame::before {
    content: ""; position: absolute; top: -44px; left: 50%;
    width: 2px; height: 44px;
    background: linear-gradient(#6e4a28, #8a6138);
    transform: translateX(-50%);
  }
  .frame::after {
    content: ""; position: absolute; top: -50px; left: 50%;
    width: 12px; height: 12px; border-radius: 50%;
    transform: translateX(-50%);
    background: radial-gradient(circle at 35% 30%, #e8e2d4, #7d7466 70%);
    box-shadow: 0 2px 3px rgba(0,0,0,.45);
  }
  .frame.taped::before, .frame.taped::after { display: none; }
  .tape {
    position: absolute; top: -12px; left: 50%;
    width: 74px; height: 24px;
    transform: translateX(-50%) rotate(-2deg);
    background: rgba(255, 244, 189, .8);
    border-left: 1px dashed rgba(0,0,0,.08);
    border-right: 1px dashed rgba(0,0,0,.08);
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }

  .frame img {
    display: block; width: 100%; height: 210px; object-fit: cover;
    border: 1px solid #eee2d0;
  }
  .frame.tall img { height: 290px; }
  .frame .caption {
    position: absolute; left: 0; right: 0; bottom: 26px;
    text-align: center; font-size: 14px; color: #7a6a55; font-style: italic;
    padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .frame .by {
    position: absolute; left: 0; right: 0; bottom: 9px;
    text-align: center; font-size: 11px; color: #b3a48d;
  }
  .frame .del {
    position: absolute; top: 4px; right: 6px;
    border: none; background: rgba(0,0,0,.12); color: #6b5033;
    width: 24px; height: 24px; border-radius: 50%;
    cursor: pointer; font-size: 13px; line-height: 24px;
    opacity: 0; transition: opacity .2s;
  }
  .frame:hover .del { opacity: 1; }
  .frame .del:hover { background: #e05b5b; color: #fff; }

  .actions { text-align: center; margin-top: 46px; }
  .btn {
    display: inline-block; border: none; cursor: pointer;
    padding: 13px 30px; margin: 6px 8px;
    border-radius: 999px; font-size: 15px; letter-spacing: .08em;
    color: #fff; background: linear-gradient(180deg, #ff9f5a, #f4772e);
    box-shadow: 0 6px 16px rgba(244, 119, 46, .45);
    transition: transform .2s, box-shadow .2s;
    text-decoration: none;
  }
  .btn.blue { background: linear-gradient(180deg, #43b7e3, #1f8fc0);
    box-shadow: 0 6px 16px rgba(31, 143, 192, .45); }
  .btn:hover { transform: translateY(-3px); }

  .board-section { max-width: 860px; margin: 80px auto; padding: 0 20px; }
  .board {
    background: rgba(255, 253, 247, .92);
    border-radius: 18px; padding: 34px;
    box-shadow: 0 20px 45px rgba(20, 60, 80, .3);
  }
  .board h2 { text-align: center; letter-spacing: .2em; margin-bottom: 6px; }
  .board .sub { text-align: center; color: #98a3aa; font-size: 13px; margin-bottom: 24px; }
  .board form { display: flex; flex-direction: column; gap: 10px; max-width: 560px; margin: 0 auto 28px; }
  .board input, .board textarea {
    border: 1.5px solid #dcd3c2; border-radius: 10px;
    padding: 11px 14px; font-size: 14px; font-family: inherit;
    background: #fff; color: var(--ink); resize: vertical;
  }
  .board input:focus, .board textarea:focus { outline: none; border-color: #43b7e3; }
  .board textarea { min-height: 84px; }
  .board .send { align-self: flex-end; border: none; }

  .msg {
    background: #fdf6e6; border-left: 4px solid #f4a83e;
    border-radius: 8px; padding: 12px 16px; margin: 10px 0;
    animation: pop .3s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }
  .msg .m-head { display: flex; justify-content: space-between; font-size: 12px; color: #b09b6e; margin-bottom: 5px; }
  .msg .m-text { font-size: 15px; line-height: 1.6; }

  footer { text-align: center; padding: 20px 0 50px; color: #7a6535; font-size: 13px; letter-spacing: .2em; }

  .modal {
    position: fixed; inset: 0; z-index: 120;
    background: rgba(15, 45, 60, .65); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal-card {
    background: var(--card); border-radius: 16px;
    padding: 30px; width: min(92vw, 420px);
    transform: scale(.9); transition: transform .25s;
    box-shadow: 0 24px 60px rgba(0,0,0,.4);
  }
  .modal.open .modal-card { transform: scale(1); }
  .modal-card h3 { margin-bottom: 16px; letter-spacing: .1em; }
  .modal-card input, .modal-card label.upl { display: block; width: 100%; }
  .modal-card input { border: 1.5px solid #dcd3c2; border-radius: 10px; padding: 10px 13px; margin-bottom: 12px; }
  .modal-card input:focus { outline: none; border-color: #f4772e; }
  .modal-card label.upl {
    border: 2px dashed #d8c6a8; border-radius: 12px;
    padding: 26px 10px; text-align: center; cursor: pointer;
    color: #a08a63; margin-bottom: 14px; transition: border-color .2s;
  }
  .modal-card label.upl:hover { border-color: #f4772e; }
  .modal-card label.upl.has { border-color: #57b96a; color: #3d8a4e; }
  .modal-card input[type=file] { display: none; }
  .modal-card .row { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-card .m-tip { color: #c98; font-size: 12px; margin-top: 10px; min-height: 16px; }

  .lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10, 30, 40, .9); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: 90vw; max-height: 80vh;
    border: 10px solid var(--card); border-radius: 4px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    transform: scale(.9); transition: transform .3s;
  }
  .lightbox.open img { transform: scale(1); }
  .lightbox .lb-cap { margin-top: 16px; color: #dff2fa; font-size: 16px; letter-spacing: .1em; text-align: center; }
  .lb-close {
    position: absolute; top: 20px; right: 26px;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.15); color: #fff; font-size: 20px; cursor: pointer;
  }
  .lb-close:hover { background: rgba(255,255,255,.32); }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.15); color: #fff; font-size: 24px; cursor: pointer;
  }
  .lb-nav:hover { background: rgba(255,255,255,.32); }
  .lb-prev { left: 20px; }
  .lb-next { right: 20px; }

  @media (max-width: 640px) {
    .wall-section { margin: 20px 12px 0; padding: 56px 14px 70px; }
    .frame { width: min(84vw, 300px); }
    .lb-nav { display: none; }
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="seagull g1">🕊️</div>
<div class="seagull g2">🕊️</div>
<div class="waves"></div>

<div class="content">
  <header>
    <h1>🌊 海边小屋 · 照片墙</h1>
    <p>SEASIDE MEMORIES · 一起分享美好瞬间</p>
  </header>

  <section class="wall-section">
    <div class="wall" id="wall"></div>
    <div class="actions">
      <button class="btn" onclick="openUpload()">📷 添加照片</button>
      <a class="btn blue" href="#board">💬 去留言</a>
    </div>
  </section>

  <section class="board-section" id="board">
    <div class="board">
      <h2>沙滩留言板</h2>
      <div class="sub">—— 写下想说的话，字会被海浪好好保存 ——</div>
      <form id="msgForm">
        <input id="msgName" placeholder="你的名字（可留空）" maxlength="20">
        <textarea id="msgText" placeholder="想说点什么…（必填）" maxlength="200" required></textarea>
        <button type="submit" class="btn send">📮 留言</button>
      </form>
      <div id="msgList"></div>
    </div>
  </section>

  <footer>© 海边小屋照片墙 · 和朋友们一起分享美好瞬间 🐚</footer>
</div>

<div class="modal" id="uploadModal">
  <div class="modal-card">
    <h3>📷 添加一张照片</h3>
    <label class="upl" id="fileLabel" for="upFile">点这里选择照片<br><small>支持 jpg / png / gif，最大 20MB</small></label>
    <input type="file" id="upFile" accept="image/*">
    <input id="upCaption" placeholder="照片标题（可留空）" maxlength="50">
    <input id="upName" placeholder="你的名字（可留空）" maxlength="20">
    <div class="row">
      <button class="btn blue" onclick="closeUpload()">取消</button>
      <button class="btn" id="upBtn" onclick="submitPhoto()">挂上墙 🖼️</button>
    </div>
    <div class="m-tip" id="upTip"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <button class="lb-nav lb-prev" onclick="step(-1)">‹</button>
  <button class="lb-nav lb-next" onclick="step(1)">›</button>
  <div>
    <img id="lbImg" alt="">
    <div class="lb-cap" id="lbCap"></div>
  </div>
</div>

<script>
const API = '';
let photos = [], current = 0;

async function loadPhotos() {
  const res = await fetch(API + '/api/photos');
  photos = await res.json();
  render();
}

function render() {
  const wall = document.getElementById('wall');
  wall.innerHTML = '';
  if (!photos.length) {
    wall.innerHTML = '<p style="color:#f4e2b8;letter-spacing:.15em;padding:30px 0;">墙上还空空的，快来挂第一张照片吧 🐚</p>';
  }
  photos.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'frame';
    d.innerHTML = `
      ${i % 4 === 0 ? '<div class="tape"></div>' : ''}
      <img src="/uploads/${p.file}" alt="${esc(p.caption)}" loading="lazy">
      <div class="caption">${esc(p.caption)}</div>
      <div class="by">by ${esc(p.nickname)} · ${esc(p.time)}</div>
      <button class="del" title="取下照片">✕</button>`;
    d.querySelector('img').onclick = () => openLb(i);
    d.querySelector('.del').onclick = e => { e.stopPropagation(); delPhoto(p.file); };
    if (i % 5 === 2) d.classList.add('tall');
    wall.appendChild(d);
  });
}

function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function delPhoto(file) {
  if (!confirm('确定取下这张照片吗？')) return;
  await fetch('/api/photos/' + file, { method: 'DELETE' });
  loadPhotos();
}

function openUpload() { document.getElementById('uploadModal').classList.add('open'); }
function closeUpload() {
  document.getElementById('uploadModal').classList.remove('open');
  document.getElementById('upFile').value = '';
  document.getElementById('upCaption').value = '';
  document.getElementById('upName').value = '';
  document.getElementById('upTip').textContent = '';
  const l = document.getElementById('fileLabel');
  l.classList.remove('has'); l.innerHTML = '点这里选择照片<br><small>支持 jpg / png / gif，最大 20MB</small>';
}
document.getElementById('uploadModal').addEventListener('click', e => { if (e.target.id === 'uploadModal') closeUpload(); });
document.getElementById('upFile').addEventListener('change', e => {
  const f = e.target.files[0];
  const l = document.getElementById('fileLabel');
  if (f) { l.classList.add('has'); l.textContent = '✅ ' + f.name; }
});

async function submitPhoto() {
  const file = document.getElementById('upFile').files[0];
  const tip = document.getElementById('upTip');
  if (!file) { tip.textContent = '请先选择一张照片哦'; return; }
  const fd = new FormData();
  fd.append('photo', file);
  fd.append('caption', document.getElementById('upCaption').value);
  fd.append('nickname', document.getElementById('upName').value);
  document.getElementById('upBtn').disabled = true;
  tip.textContent = '正在挂上墙…';
  try {
    const res = await fetch('/api/photos', { method: 'POST', body: fd });
    const j = await res.json();
    if (!res.ok) { tip.textContent = j.error || '上传失败'; return; }
    closeUpload();
    loadPhotos();
  } catch {
    tip.textContent = '网络出错了，请重试';
  } finally {
    document.getElementById('upBtn').disabled = false;
  }
}

function openLb(i) { current = i; updLb(); document.getElementById('lightbox').classList.add('open'); }
function closeLb() { document.getElementById('lightbox').classList.remove('open'); }
function step(d) { current = (current + d + photos.length) % photos.length; updLb(); }
function updLb() {
  const p = photos[current];
  document.getElementById('lbImg').src = '/uploads/' + p.file;
  document.getElementById('lbCap').textContent = `${p.caption} · by ${p.nickname}`;
}
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLb(); });
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').classList.contains('open')) {
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  } else if (e.key === 'Escape') closeUpload();
});

async function loadMessages() {
  const res = await fetch('/api/messages');
  const msgs = await res.json();
  const box = document.getElementById('msgList');
  box.innerHTML = msgs.length ? '' : '<p style="text-align:center;color:#b3a48d;padding:16px;">还没有留言，来做第一个吧 🐚</p>';
  msgs.forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg';
    d.innerHTML = `<div class="m-head"><span>🐚 ${esc(m.name)}</span><span>${esc(m.time)}</span></div><div class="m-text">${esc(m.text)}</div>`;
    box.appendChild(d);
  });
}
document.getElementById('msgForm').addEventListener('submit', async e => {
  e.preventDefault();
  const text = document.getElementById('msgText').value.trim();
  if (!text) return;
  await fetch('/api/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: document.getElementById('msgName').value || '神秘朋友',
      text
    })
  });
  document.getElementById('msgText').value = '';
  loadMessages();
});

loadPhotos();
loadMessages();
</script>
</body>
</html>
